<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drug Recommendation System</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Drug Recommendation System</h1>
            <p>ML-powered educational drug classification prototype</p>
        </div>

        <div class="card">

            <h2>Patient Information</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="age" placeholder="Enter age">
                </div>

                <div class="form-group">
                    <label>Sex</label>
                    <select id="sex">
                        <option value="">Select sex</option>
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Blood Pressure</label>
                    <select id="bp">
                        <option value="">Select blood pressure</option>
                        <option value="LOW">Low</option>
                        <option value="NORMAL">Normal</option>
                        <option value="HIGH">High</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Cholesterol</label>
                    <select id="cholesterol">
                        <option value="">Select cholesterol</option>
                        <option value="NORMAL">Normal</option>
                        <option value="HIGH">High</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>Na-to-K Ratio</label>
                    <input type="number" step="0.1" id="na_to_k"
                           placeholder="Example: 15.5">
                </div>

            </div>

            <button onclick="predictDrug()">
                Predict Drug Class
            </button>

            <div id="result" class="result hidden"></div>

        </div>

        <div class="disclaimer">
            <strong>Disclaimer:</strong>
            This is an educational machine-learning prototype.
            It is not intended for clinical diagnosis or medical prescribing.
        </div>

    </div>

    <script src="/static/script.js"></script>

</body>
</html>
